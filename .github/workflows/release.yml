name: 发布

# 推送 v* 标签（如 v0.1.0-rc.1、v0.1.0）触发。
#
# Go 模块随标签发布：推送标签那一刻版本就对外可见，模块代理一旦取过就收不回，工作流拦不住。
# 所以打标签之前先在本地跑 scripts/release-check.sh <标签>（version-release 技能），guard 再跑同一份脚本复核：
# 不通过就报红，不删标签（代理可能已经缓存，删了也收不回，只能发下一个号）。
#
# guard 通过后让 Go 模块代理取一次这个版本（pkg.go.dev 随之收录）。
# GitHub Release 与 XiHan.Framework 一样，在标签推送之后手动建（version-release 技能）。
# 手动 Run workflow 时必须选中一个版本标签；选分支会被 guard 拦下。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: 发版核对
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          # 要拿完整历史才能判断祖先关系；子模块不检出，脚本读树里记的指针
          fetch-depth: 0

      - name: 只接受版本标签
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::发布只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: 核对标签、版本与规范标签
        id: check
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  publish:
    name: 模块代理收录
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 经 proxy.golang.org 取这个版本
        # 在模块之外查询：在本模块目录里不能按版本查主模块。代理第一次取新标签可能要等一会儿，失败就重试
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          module="github.com/xihanfun/framework-sdk-go@$GITHUB_REF_NAME"
          for attempt in 1 2 3 4 5 6; do
            if go list -m -json "$module"; then
              exit 0
            fi
            echo "代理还没取到 $module，30 秒后重试（第 $attempt 次）"
            sleep 30
          done
          echo "::error::proxy.golang.org 取不到 $module"
          exit 1
