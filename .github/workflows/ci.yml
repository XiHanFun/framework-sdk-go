name: CI

# Go SDK 的门禁：生成物与规范一致（只在 ubuntu 上核对）、格式与静态检查（staticcheck 只在 ubuntu 上跑）、依赖漏洞扫描（govulncheck，单独一个作业）、全部测试（含用黑盒运行器跑 examples/echo 与 examples/cache 的插件）。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 生成物只取决于 plugin.proto 与生成器的版本，与操作系统无关：只在 ubuntu 上核对，Windows 任务不必编译 buf
      - name: 安装 buf 与生成器
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: 生成物与规范一致
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          buf generate
          # git diff 看不见新增的未跟踪文件，用 git status 判空：改动、删除与新增都算不一致
          if [ -n "$(git status --porcelain -- plugin/v1)" ]; then
            echo "buf generate does not reproduce the committed plugin/v1:"
            git status --short -- plugin/v1
            git diff -- plugin/v1
            exit 1
          fi

      - name: 格式与静态检查
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      # 版本钉死：新版本会带来新的检查项，升级时先在本机跑通再改这里。只在 ubuntu 上跑，*_windows.go 靠本机核对
      - name: staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: 测试
        # -race 需要 cgo；Windows 运行器上不带
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  vulnerabilities:
    # 漏洞扫描用最新的稳定工具链，不用 go.mod 的 go 指令：标准库的漏洞随工具链补丁修复，使用者用自己的工具链编译；
    # 这里要拦的是依赖里代码调得到的漏洞。govulncheck 只在代码调得到漏洞时失败
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Go（最新稳定版）
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # 版本钉死，升级时先在本机跑通再改这里
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
